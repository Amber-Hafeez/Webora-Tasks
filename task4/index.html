<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Webora Tech</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">🛍️ Webora <span>Tech</span></div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">About</a>
      <a href="#" class="active">Contact</a>
    </nav>
  </header>

  <main class="page">
    <section class="intro">
      <h1>Get in <span>Touch</span></h1>
      <p>Have a question or an idea? Send us a message and we will get back to you soon.</p>
      <div class="underline"></div>
    </section>

    <section class="form-card">
      <div id="successMsg" class="success" role="alert"></div>

      <form id="contactForm" novalidate>
        <div class="field">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your name">
          <span class="error" id="nameError"></span>
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com">
          <span class="error" id="emailError"></span>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" rows="5" placeholder="Write your message here..."></textarea>
          <span class="error" id="messageError"></span>
        </div>

        <button type="submit" class="btn-submit">Send Message ✈️</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="f-links">
      <a href="https://github.com/" target="_blank">GitHub</a>
      <a href="https://linkedin.com/" target="_blank">LinkedIn</a>
    </div>
    <p>© 2026 Webora Tech. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
